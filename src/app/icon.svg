<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KubeVision AI">
  <defs>
    <linearGradient id="kvRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <radialGradient id="kvCore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- deep-space plate -->
  <rect width="64" height="64" rx="14" fill="#020617" />
  <rect width="64" height="64" rx="14" fill="url(#kvCore)" />

  <!-- cyber grid hairline -->
  <g stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1">
    <path d="M8 21.3h48M8 32h48M8 42.7h48" />
    <path d="M21.3 8v48M32 8v48M42.7 8v48" />
  </g>

  <!-- hexagonal cluster rim -->
  <path
    d="M32 9.5 51.5 20.75v22.5L32 54.5 12.5 43.25v-22.5Z"
    fill="none"
    stroke="url(#kvRim)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <!-- K / V monogram -->
  <g fill="none" stroke="#22d3ee" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23.5 22.5v19" />
    <path d="M23.5 32 31 22.5" />
    <path d="M23.5 32 31.5 41.5" />
    <path d="M36 22.5 41.5 41.5" />
    <path d="M41.5 41.5 47 22.5" />
  </g>

  <!-- telemetry beacon -->
  <circle cx="32" cy="32" r="2.4" fill="#34d399" />
</svg>